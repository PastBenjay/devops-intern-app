apiVersion: batch/v1
kind: Job
metadata:
  name: java-app
  namespace: intern-app
spec:
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app
          image: pastbenjay/java-app:latest
          env:
            - name: NAME
              value: "Intern"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
      restartPolicy: Never
  backoffLimit: 0
