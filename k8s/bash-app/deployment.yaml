apiVersion: batch/v1
kind: Job
metadata:
  name: bash-app
  namespace: intern-app
spec:
  template:
    metadata:
      labels:
        app: bash-app
    spec:
      containers:
        - name: bash-app
          image: pastbenjay/bash-app:latest
          env:
            - name: NAME
              value: "Intern"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      restartPolicy: Never
  backoffLimit: 0
